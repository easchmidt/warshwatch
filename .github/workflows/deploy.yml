name: Refresh data and deploy

on:
  schedule:
    - cron: '15 14 * * *'   # daily, after the 8:30 ET data releases
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If the refresh fails, the committed data/data.js is deployed instead (the
      # script only writes the file after every download succeeds). Failures show
      # up as annotations on the run.
      - name: Fetch latest data
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: ./scripts/fetch-data.ps1

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
