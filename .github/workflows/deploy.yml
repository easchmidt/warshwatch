name: Refresh data and deploy

on:
  schedule:
    - cron: '15 14 * * *'   # daily, after the 8:30 ET data releases
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy even if the data has not changed'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # Start from the data the live site is serving, not the (older) copy in the
      # repo. If a download below fails, the script leaves this file in place and
      # its fallbacks (release calendar, readings) build on it, so a failed run
      # never rolls the site back.
      - name: Start from live data
        run: |
          if curl -fsSL --max-time 60 "${{ steps.pages.outputs.base_url }}/data/data.js" -o live-data.js \
             && grep -q 'window.WARSH_DATA' live-data.js; then
            cp live-data.js data/data.js
          else
            echo "::warning title=live-data::Could not read the live data.js; starting from the committed copy."
            cp data/data.js live-data.js
          fi

      # The script only writes data.js after every required download succeeds.
      # Failures show up as annotations on the run.
      - name: Fetch latest data
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINVIZ_API_TOKEN: ${{ secrets.FINVIZ_API_TOKEN }}
        run: ./scripts/fetch-data.ps1

      # The scheduled run deploys only when the data changed (ignoring the
      # "generated" timestamp). Pushes and manual runs always deploy.
      - name: Check for new data
        id: diff
        run: |
          strip() { sed -E 's/"generated":"[^"]*",?//' "$1"; }
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif cmp -s <(strip live-data.js) <(strip data/data.js); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new data since the last deploy; skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble site
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
